[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# One file a test writes, on request, and reads: the simulated pool's page data recorded off the contract
# (test/sim/SimPool.t.sol, test_page_recordedChain).
fs_permissions = [{ access = "read-write", path = "./app/tests/fixtures/sim-page-chain.json" }]

[rpc_endpoints]
# Testnet only. This project sends nothing to HyperEVM mainnet (chain 999).
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
