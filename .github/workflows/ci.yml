name: ci

# `scrub` is the hygiene gate: generic patterns for credentials, infrastructure identity and
# internal paths. It runs on every branch, because this repository is meant to go public and
# anything that reaches its history stays there after a revert. The gate is run next to its
# own falsification test, so a pattern that silently stops matching turns this job red.
#
# `contracts` builds and runs the Foundry tests. They use the hyper-evm-lib simulator in
# offline mode, so no RPC is involved and a run is deterministic.
#
# Actions are pinned by commit SHA, not by tag. A tag is a moving pointer.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: gate can still go red
        run: ./scripts/test-scrub-check.sh
      - name: hygiene gate
        run: ./scripts/scrub-check.sh

  identity:
    # Every commit must carry a GitHub noreply identity. Needs the whole history. On a pull
    # request it checks the branch head, not the temporary merge commit GitHub builds for
    # the run, which never lands anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: check can still go red
        run: ./scripts/test-identity-check.sh
      - name: commit identities
        run: ./scripts/identity-check.sh HEAD

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: build
        run: forge build
      - name: test
        run: forge test -vv
